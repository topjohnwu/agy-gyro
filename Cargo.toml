[package]
name = "agy-gyro"
version = "0.1.2"
edition = "2024"
authors = ["John Wu <topjohnwu@gmail.com>"]
description = "Local retry proxy to stabilize the Antigravity CLI (agy) against transient Google Gemini API errors"
readme = "README.md"
license = "MIT"
repository = "https://github.com/topjohnwu/agy-gyro"
homepage = "https://github.com/topjohnwu/agy-gyro"
keywords = ["gemini", "retry", "proxy", "antigravity", "llm"]
categories = [
    "command-line-utilities",
    "development-tools",
    "network-programming",
]
include = [
    "src/**/*",
    "tests/**/*",
    "assets/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[dependencies]
tokio = { version = "1.53", features = ["full"] }
axum = { version = "0.8", features = ["tokio"] }
reqwest = { version = "0.13", default-features = false, features = [
    "stream",
    "json",
    "http2",
    "gzip",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.10"
futures-util = { version = "0.3", default-features = false, features = [
    "alloc",
] }
httpdate = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "1.0", default-features = false, features = [
    "parse",
    "serde",
] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_env = "musl")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = [
    "native-tls-vendored",
] }

[target.'cfg(not(target_env = "musl"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = [
    "native-tls",
] }

[dev-dependencies]
wiremock = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
